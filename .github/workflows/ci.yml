
name: ApplyOra CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: applyora-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-check:
    name: Build and Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify project configuration
        run: |
          echo "Working directory:"
          pwd

          echo "Available package scripts:"
          npm run

          node -e "
            const scripts = require('./package.json').scripts;
            if (!scripts.test) {
              console.error('Missing test script in package.json');
              process.exit(1);
            }
          "

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Production build
        run: npm run build
        env:
          CI: true
          MONGODB_URI: mongodb://127.0.0.1:27017/applyora_test
          JWT_ACCESS_SECRET: ci-only-test-secret-not-for-production
          APP_URL: http://localhost:3000
          ADMIN_BOOTSTRAP_USERNAME: test-admin
          ADMIN_BOOTSTRAP_PASSWORD: test-password
