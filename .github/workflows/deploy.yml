name: ApplyOra CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: applyora-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Build and quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27018:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run tests
        run: npm test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27018/applyora_integration_test
          MONGODB_URI: mongodb://127.0.0.1:27018/applyora_integration_test
          JWT_ACCESS_SECRET: isolated-integration-secret
          ADMIN_BOOTSTRAP_USERNAME: integration-admin
          ADMIN_BOOTSTRAP_PASSWORD: integration-password

      - name: Production build
        run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/applyora_test
          JWT_ACCESS_SECRET: ci-only-test-secret-not-for-production
          ADMIN_BOOTSTRAP_USERNAME: ci-admin
          ADMIN_BOOTSTRAP_PASSWORD: ci-only-admin-password
